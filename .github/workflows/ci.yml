name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Matches the Gradle toolchain (JavaLanguageVersion.of(27)) in build.gradle.kts.
      # setup-java's built-in Gradle cache is used instead of gradle/actions@v6, whose caching is no longer open source.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Build (compile, unit, integration and architecture tests)
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
