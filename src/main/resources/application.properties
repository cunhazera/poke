spring.application.name=poke

# PokeAPI (https://pokeapi.co/docs/v2)
pokeapi.base-url=${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
pokeapi.connect-timeout=2s
pokeapi.read-timeout=5s

# PokeAPI data is effectively static (it sends Cache-Control max-age=86400) and its fair-use policy asks clients to cache.
spring.cache.cache-names=pokeapi-entries,pokeapi-pokemon,pokeapi-species,pokeapi-evolution
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=24h,recordStats

# PostgreSQL. Defaults match compose.yaml; override with env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poke}
spring.datasource.username=${DB_USER:poke}
spring.datasource.password=${DB_PASSWORD:poke}

# Flyway owns the schema (src/main/resources/db/migration). Never edit an applied migration: add V<n+1>.
spring.flyway.validate-on-migrate=true

# Only the health endpoint is exposed (Docker healthcheck, compose depends_on). It includes the database.
management.endpoints.web.exposure.include=health

# Hibernate maps entities onto the Flyway schema and only checks it; it never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Bearer tokens (HS256). No default secret on purpose: startup fails unless JWT_SECRET (>= 32 bytes) is set.
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.validity=${JWT_VALIDITY:1h}

# Hibernate logs every SQL error at WARN, including the expected unique violations behind a 409 (username taken).
# Unexpected SQL errors still surface: they become 500s, which GlobalExceptionHandler logs with the stack trace.
logging.level.org.hibernate.orm.jdbc.error=ERROR
# Load the collections of a whole page in a few batched queries instead of one query per row (N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Request bodies are read strictly: an unknown field (a typo, or "pokedexNumber" on an edit) and a fraction where an
# integer belongs (a stat of 33.7) are 400s, never silently ignored or truncated. Auth bodies opt out (see their DTOs).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
