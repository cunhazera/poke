spring.application.name=poke

# PokeAPI (https://pokeapi.co/docs/v2)
pokeapi.base-url=https://pokeapi.co/api/v2
pokeapi.connect-timeout=2s
pokeapi.read-timeout=5s

# PokeAPI data is effectively static (it sends Cache-Control max-age=86400) and its fair-use policy asks clients to cache.
spring.cache.cache-names=pokeapi-entries,pokeapi-pokemon,pokeapi-species
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=24h

# PostgreSQL. Defaults match compose.yaml; override with env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poke}
spring.datasource.username=${DB_USER:poke}
spring.datasource.password=${DB_PASSWORD:poke}

# Flyway owns the schema (src/main/resources/db/migration). Never edit an applied migration: add V<n+1>.
spring.flyway.validate-on-migrate=true
