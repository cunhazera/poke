spring.application.name=task-api

# PostgreSQL. Defaults match compose.yaml; override with env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasks}
spring.datasource.username=${DB_USER:tasks}
spring.datasource.password=${DB_PASSWORD:tasks}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Request bodies are read strictly: an unknown field (a typo, or "status" on create) is a 400, never silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Errors never include stack traces or exception details (ApiExceptionHandler writes every error body).
server.error.include-stacktrace=never
server.error.include-message=never

# Health only (the Docker healthcheck).
management.endpoints.web.exposure.include=health

# The board admin is told about every overdue task, along with the task's owner. 'ada' is one of the default users.
tasks.board.admin-username=${BOARD_ADMIN_USERNAME:ada}
# How often to look for newly overdue tasks.
tasks.overdue.check-interval=${OVERDUE_CHECK_INTERVAL:PT1M}
